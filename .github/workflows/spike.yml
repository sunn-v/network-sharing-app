name: spike

on:
  push:
    paths: ["spike/**", ".github/workflows/spike.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spike
      - run: cargo test
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: lanshare-spike-${{ matrix.os }}
          path: |
            spike/target/release/lanshare-spike
            spike/target/release/lanshare-spike.exe
          if-no-files-found: error
